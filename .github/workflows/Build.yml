name: Build FaceFusion Mobile APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Build Dependencies
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Download Qualcomm QAIRT SDK
        run: |
          set -euo pipefail
          QAIRT_VERSION="2.47.0.260601"
          QAIRT_ZIP="$RUNNER_TEMP/v${QAIRT_VERSION}.zip"
          QAIRT_DIR="$RUNNER_TEMP/qairt"
          curl --fail --location --retry 3 \
            "https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/${QAIRT_VERSION}/v${QAIRT_VERSION}.zip" \
            --output "$QAIRT_ZIP"
          unzip -q "$QAIRT_ZIP" -d "$QAIRT_DIR"
          echo "QNN_SDK_ROOT=$QAIRT_DIR/qairt/${QAIRT_VERSION}" >> "$GITHUB_ENV"
          echo "QAIRT_VERSION=${QAIRT_VERSION}" >> "$GITHUB_ENV"

      - name: Stage QNN Headers and Android/Hexagon Runtimes
        run: |
          chmod +x work/android/stage_qnn.sh
          bash work/android/stage_qnn.sh

      - name: Grant Execute Permission
        run: chmod +x work/android/gradlew

      - name: Build Release APK
        working-directory: work/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Align and Sign APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find work/android/app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "APK bulunamadi!"
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/facefusion-debug.keystore"
          OUTPUT="$RUNNER_TEMP/signed-apk"
          mkdir -p "$OUTPUT"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" -f -v 4 \
            "$APK_PATH" \
            "$OUTPUT/facefusion-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT/facefusion-mobile-release.apk" \
            "$OUTPUT/facefusion-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose \
            "$OUTPUT/facefusion-mobile-release.apk"

          echo "APK imzalandi ve dogrulandi."

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceFusion-mobile-SIGNED
          path: ${{ runner.temp }}/signed-apk/facefusion-mobile-release.apk
          if-no-files-found: error
