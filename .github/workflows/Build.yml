name: Build FaceFusion Mobile APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Build Dependencies
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      # QNN headers and runtime libraries are intentionally gitignored.
      # Download the public Qualcomm QAIRT SDK and stage the exact files
      # required by work/android/stage_qnn.sh before Gradle starts.
      - name: Download Qualcomm QAIRT SDK
        run: |
          set -euo pipefail
          QAIRT_VERSION="2.47.0.260601"
          QAIRT_ZIP="$RUNNER_TEMP/v${QAIRT_VERSION}.zip"
          QAIRT_DIR="$RUNNER_TEMP/qairt"
          curl --fail --location --retry 3 \
            "https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/${QAIRT_VERSION}/v${QAIRT_VERSION}.zip" \
            --output "$QAIRT_ZIP"
          unzip -q "$QAIRT_ZIP" -d "$QAIRT_DIR"
          echo "QNN_SDK_ROOT=$QAIRT_DIR/qairt/${QAIRT_VERSION}" >> "$GITHUB_ENV"
          echo "QAIRT_VERSION=${QAIRT_VERSION}" >> "$GITHUB_ENV"

      - name: Stage QNN Headers and Android/Hexagon Runtimes
        run: |
          chmod +x work/android/stage_qnn.sh
          bash work/android/stage_qnn.sh

      - name: Grant Execute Permission
        run: chmod +x work/android/gradlew

      - name: Build Release APK
        working-directory: work/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceFusion-mobile-release
          path: work/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
